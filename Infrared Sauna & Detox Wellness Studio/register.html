<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Client Account | Aura &amp; Solace Infrared Wellness Sanctuary</title>
  <meta name="description" content="Register your private account to manage appointments, track consistency goals, and unlock exclusive membership privileges.">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme-rtl.js"></script>
</head>
<body class="bg-light">

  <!-- Simplified Brand Navbar -->
  <nav class="navbar aura-navbar bg-white border-bottom">
    <div class="container justify-content-between">
      <a class="navbar-brand aura-brand" href="index.html">
        <span class="aura-brand-icon"><i class="bi bi-sun-fill"></i></span>
        <span>Aura &amp; Solace</span>
      </a>
      <div class="d-flex align-items-center gap-2 flex-nowrap">
        <div class="aura-header-controls me-1">
          <button type="button" class="btn-aura-control btn-theme-toggle" id="theme-toggle-btn" aria-label="Toggle Dark Mode" title="Toggle Dark/Light Mode">
            <i class="bi bi-moon-stars-fill theme-icon-indicator"></i>
          </button>
          <button type="button" class="btn-aura-control btn-dir-toggle" id="dir-toggle-btn" aria-label="Toggle RTL/LTR" title="Switch text direction (LTR / RTL)">
            <i class="bi bi-arrow-left-right small me-1"></i>
            <span class="dir-pill-switch">LTR</span>
          </button>
        </div>
        <a href="index.html" class="btn btn-sm btn-outline-secondary rounded-pill">
          <i class="bi bi-arrow-left me-1"></i> Back to Studio
        </a>
      </div>
    </div>
  </nav>

  <!-- Register Card Form Wrapper -->
  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 520px;">
      <div class="text-center mb-4">
        <span class="aura-badge badge-amber mb-2">New Client</span>
        <h2 class="font-serif fw-bold text-dark mb-1">Create Account</h2>
        <p class="text-muted small">Join our wellness community and manage your private sessions.</p>
      </div>

      <form id="register-form">
        <div class="mb-3">
          <label for="register-name" class="form-label small fw-bold">Full Name <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
            <input type="text" id="register-name" class="form-control border-start-0 py-2" placeholder="e.g. Maya Lin" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="register-email" class="form-label small fw-bold">Email Address <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
            <input type="email" id="register-email" class="form-control border-start-0 py-2" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="mb-3">
          <label for="register-phone" class="form-label small fw-bold">Phone Number <span class="text-muted fw-normal">(Numbers only)</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone text-muted"></i></span>
            <input type="tel" id="register-phone" class="form-control border-start-0 py-2" placeholder="e.g. 5552348901" inputmode="numeric" pattern="[0-9]*" maxlength="15" autocomplete="tel" title="Numbers only (0-9)">
          </div>
          <div class="form-text small text-muted">Used solely for session reminders (numbers only, 0-9).</div>
        </div>

        <div class="mb-3">
          <label for="register-password" class="form-label small fw-bold">Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" id="register-password" class="form-control border-start-0 border-end-0 py-2" placeholder="At least 6 characters" required autocomplete="new-password">
            <button class="btn btn-outline-secondary border-start-0 password-toggle-btn" type="button" data-target="register-password" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="mb-3">
          <label for="register-confirm-password" class="form-label small fw-bold">Confirm Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
            <input type="password" id="register-confirm-password" class="form-control border-start-0 border-end-0 py-2" placeholder="Repeat your password" required autocomplete="new-password">
            <button class="btn btn-outline-secondary border-start-0 password-toggle-btn" type="button" data-target="register-confirm-password" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="register-terms" required>
          <label class="form-check-label small text-muted" for="register-terms">
            I agree to the studio <a href="faq.html" class="text-warning">policies</a>, terms of service, and privacy standards.
          </label>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-aura-primary btn-lg shadow-sm">
            Create Sanctuary Account
          </button>
        </div>
      </form>

      <div class="text-center mt-4 text-muted small">
        Already registered? 
        <a href="login.html" class="fw-bold text-warning text-decoration-none">Sign In Here</a>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
