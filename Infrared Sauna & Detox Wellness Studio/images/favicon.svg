<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="45%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#C25E35"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Sanctuary Emblem -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#auraGrad)"/>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>

  <!-- Radiant Infrared Sunburst Rays -->
  <g fill="url(#sunGrad)" opacity="0.95">
    <!-- Cardinal Rays -->
    <path d="M32 9 L34.5 18 L29.5 18 Z"/>
    <path d="M32 55 L34.5 46 L29.5 46 Z"/>
    <path d="M9 32 L18 34.5 L18 29.5 Z"/>
    <path d="M55 32 L46 34.5 L46 29.5 Z"/>
    
    <!-- Diagonal Rays -->
    <path d="M15.7 15.7 L23.2 19.8 L19.8 23.2 Z"/>
    <path d="M48.3 15.7 L44.2 23.2 L40.8 19.8 Z"/>
    <path d="M15.7 48.3 L19.8 40.8 L23.2 44.2 Z"/>
    <path d="M48.3 48.3 L40.8 44.2 L44.2 40.8 Z"/>
  </g>

  <!-- Glowing Central Solar Disc -->
  <circle cx="32" cy="32" r="10.5" fill="url(#sunGrad)"/>
  <circle cx="32" cy="32" r="6" fill="#D97706" opacity="0.2"/>
</svg>