<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password Confirmation | Aura &amp; Solace Infrared Wellness Sanctuary</title>
  <meta name="description" content="Enter your reset verification code and choose a new secure password for your client account.">
    <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="alternate icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="shortcut icon" href="images/favicon.ico">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme-rtl.js"></script>
</head>
<body class="bg-light">

  <nav class="navbar aura-navbar bg-white border-bottom sticky-top">
    <div class="container justify-content-between">
      <a class="navbar-brand aura-brand" href="index.html">
        <span class="aura-brand-icon"><i class="bi bi-sun-fill"></i></span>
        <span>Aura &amp; Solace</span>
      </a>
      <div class="d-flex align-items-center gap-2 flex-nowrap">
        <div class="aura-header-controls me-1">
          <button type="button" class="btn-aura-control btn-theme-toggle" id="theme-toggle-btn" aria-label="Toggle Dark Mode" title="Toggle Dark/Light Mode">
            <i class="bi bi-moon-stars-fill theme-icon-indicator"></i>
          </button>
          <button type="button" class="btn-aura-control btn-dir-toggle" id="dir-toggle-btn" aria-label="Toggle RTL/LTR" title="Switch text direction (LTR / RTL)">
            <i class="bi bi-arrow-left-right small me-1"></i>
            <span class="dir-pill-switch">LTR</span>
          </button>
        </div>
        <a href="login.html" class="btn btn-sm btn-outline-secondary rounded-pill">
          <i class="bi bi-arrow-left me-1"></i> Return to Login
        </a>
      </div>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="stat-icon bg-warning bg-opacity-10 text-warning mx-auto mb-3" style="width: 56px; height: 56px;">
          <i class="bi bi-key fs-3"></i>
        </div>
        <h2 class="font-serif fw-bold text-dark mb-1">Set New Password</h2>
        <p class="text-muted small">Enter your reset code and choose a new secure password.</p>
      </div>

      <form id="reset-password-form">
        <div class="mb-3">
          <label for="reset-email" class="form-label small fw-bold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
            <input type="email" id="reset-email" class="form-control border-start-0 py-2" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="reset-code" class="form-label small fw-bold">Reset Verification Code</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
            <input type="text" id="reset-code" class="form-control border-start-0 py-2" placeholder="123456" value="123456" required>
          </div>
          <div class="form-text small text-muted">For demo evaluation, default test code is <code>123456</code>.</div>
        </div>

        <div class="mb-3">
          <label for="reset-new-password" class="form-label small fw-bold">New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" id="reset-new-password" class="form-control border-start-0 border-end-0 py-2" placeholder="At least 6 characters" required autocomplete="new-password">
            <button class="btn btn-outline-secondary border-start-0 password-toggle-btn" type="button" data-target="reset-new-password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="mb-3">
          <label for="reset-confirm-password" class="form-label small fw-bold">Confirm New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
            <input type="password" id="reset-confirm-password" class="form-control border-start-0 border-end-0 py-2" placeholder="Repeat new password" required autocomplete="new-password">
            <button class="btn btn-outline-secondary border-start-0 password-toggle-btn" type="button" data-target="reset-confirm-password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-aura-primary btn-lg shadow-sm">
            Save New Password
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
