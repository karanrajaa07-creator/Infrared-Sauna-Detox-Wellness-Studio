<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Aura &amp; Solace Infrared Wellness Sanctuary</title>
  <meta name="description" content="Reset your client portal password. Enter your registered email to receive verification instructions.">
    <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="alternate icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="shortcut icon" href="images/favicon.ico">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme-rtl.js"></script>
</head>
<body class="bg-light">

  <nav class="navbar aura-navbar bg-white border-bottom sticky-top">
    <div class="container justify-content-between">
      <a class="navbar-brand aura-brand" href="index.html">
        <span class="aura-brand-icon"><i class="bi bi-sun-fill"></i></span>
        <span>Aura &amp; Solace</span>
      </a>
      <div class="d-flex align-items-center gap-2 flex-nowrap">
        <div class="aura-header-controls me-1">
          <button type="button" class="btn-aura-control btn-theme-toggle" id="theme-toggle-btn" aria-label="Toggle Dark Mode" title="Toggle Dark/Light Mode">
            <i class="bi bi-moon-stars-fill theme-icon-indicator"></i>
          </button>
          <button type="button" class="btn-aura-control btn-dir-toggle" id="dir-toggle-btn" aria-label="Toggle RTL/LTR" title="Switch text direction (LTR / RTL)">
            <i class="bi bi-arrow-left-right small me-1"></i>
            <span class="dir-pill-switch">LTR</span>
          </button>
        </div>
        <a href="login.html" class="btn btn-sm btn-outline-secondary rounded-pill">
          <i class="bi bi-arrow-left me-1"></i> Return to Login
        </a>
      </div>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="stat-icon bg-warning bg-opacity-10 text-warning mx-auto mb-3" style="width: 56px; height: 56px;">
          <i class="bi bi-shield-lock fs-3"></i>
        </div>
        <h2 class="font-serif fw-bold text-dark mb-1">Reset Password</h2>
        <p class="text-muted small">Enter your account email to receive reset instructions.</p>
      </div>

      <div id="forgot-result-box" class="d-none mb-3">
        <!-- Dynamically populated -->
      </div>

      <form id="forgot-password-form">
        <div class="mb-3">
          <label for="forgot-email" class="form-label small fw-bold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
            <input type="email" id="forgot-email" class="form-control border-start-0 py-2" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-aura-primary btn-lg shadow-sm">
            Send Reset Instructions
          </button>
        </div>
      </form>

      <div class="text-center mt-4 text-muted small">
        Remember your credentials? 
        <a href="login.html" class="fw-bold text-warning text-decoration-none">Sign In Here</a>
      </div>
    </div>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
